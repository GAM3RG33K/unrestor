name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build (core, daemon, CLI, app)
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app bundle and DMG
        run: scripts/make-app.sh
      - name: Smoke test the bundled CLI
        run: dist/Unrestor.app/Contents/Helpers/unrestor --version
