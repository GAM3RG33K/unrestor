# Push a tag like v0.1.0 to build the DMG on GitHub's Mac runner and publish a
# release. No Apple certificates are involved: the app is ad-hoc signed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the version in the source
        run: |
          src="$(sed -n 's/.*current = "\(.*\)".*/\1/p' Sources/UnrestorCore/Protocol.swift)"
          [ "v$src" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != source v$src" >&2; exit 1; }
      - name: Test
        run: swift test
      - name: Build the app and DMG
        run: scripts/make-app.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha="$(cut -d' ' -f1 "dist/Unrestor-$version.dmg.sha256")"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Unrestor-$version.dmg" "dist/Unrestor-$version.dmg.sha256" \
            --title "Unrestor $version" \
            --notes "SHA-256: \`$sha\`

          Not notarized. See the install steps in the README."
