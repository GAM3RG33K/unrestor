# Publishes site/ to GitHub Pages. Nothing is fetched at visit time: the page
# has no scripts that call out, so visitors' browsers talk only to the site's own
# host. At deploy time, __SITE_URL__ and __DATE__ in the files are replaced.
#
# To serve from your own domain, set the repository variable SITE_URL
# (Settings -> Secrets and variables -> Actions -> Variables), for example
# https://unrestor.example.com , and set the custom domain in Settings -> Pages.
# Without it the page uses the github.io address.
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fill in the site address and date
        env:
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          name="${GITHUB_REPOSITORY#*/}"
          default="https://$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io/$name"
          url="${SITE_URL_VAR:-$default}"
          url="${url%/}"
          case "$url" in https://*) ;; *) echo "SITE_URL must start with https://" >&2; exit 1;; esac
          # Replace in every text file that carries the token.
          grep -rlI --exclude-dir=fonts '__SITE_URL__\|__DATE__' site | while read -r f; do
            sed -i "s|__SITE_URL__|$url|g; s|__DATE__|$(date -u +%F)|g" "$f"
          done
          echo "Site address: $url"
          if grep -rI --exclude-dir=fonts -n '__SITE_URL__\|__DATE__' site; then
            echo "unreplaced tokens remain" >&2; exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
