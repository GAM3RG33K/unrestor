name: Bug report
description: Something did not work as described
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Unrestor, macOS, and Mac model
      placeholder: "0.1.0, macOS 15.1, MacBook Air M2"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: Output of `unrestor status` and `pmset -g | grep SleepDisabled`
      render: text
