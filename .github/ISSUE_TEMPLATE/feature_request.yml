name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Requests are read, but this project is deliberately small and most will not be built. You are free to fork it (Apache-2.0) and add it yourself.
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations: { required: true }
