name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are read, but Unrestor is a deliberately small personal project, so most requests won't be built and there is no timeline. You are free to fork it (Apache-2.0) and add it yourself. Pull requests are not accepted.
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
    validations: { required: true }
